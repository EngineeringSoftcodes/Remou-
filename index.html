<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remou™</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #f5f6fa;
      color: #2f3640;
      transition: background 0.3s, color 0.3s;
    }

    body.dark-mode {
      background: #2f3640;
      color: #f5f6fa;
    }

    header {
      background: #6c5ce7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .uploader {
      border: 2px dashed #6c5ce7;
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 16px;
    }

    input[type="file"], select, input[type="range"] {
      margin: 10px;
    }

    video, canvas {
      display: block;
      margin: 20px auto;
      max-width: 100%;
      border-radius: 8px;
    }

    .download-btns {
      text-align: center;
      margin-top: 20px;
    }

    .download-btns button {
      background: #6c5ce7;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .download-btns button:hover {
      background: #4834d4;
    }

    .switch-theme {
      float: right;
      background: transparent;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: -40px;
      margin-right: 20px;
    }

    #status {
      text-align: center;
      margin: 15px;
      font-size: 16px;
    }

    #manualDownload {
      display: none;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<header>
  <h1>Remou™</h1>
  <p>Green Screen Video Remover by Engineering Softcodes ™</p>
</header>

<div class="container">
  <div class="uploader">
    <p>Upload green screen video:</p>
    <input type="file" id="videoUpload" accept="video/*" />
    <p>Optional: Upload background image</p>
    <input type="file" id="bgUpload" accept="image/*" />
    <br/>
    <label>Green Sensitivity: <span id="sensitivityValue">100</span></label>
    <input type="range" id="sensitivity" min="50" max="200" value="100" />
    <br/>
    <select id="downloadFormat">
      <option value="webm" selected>WebM</option>
      <option value="mp4">MP4 (Simulated*)</option>
    </select>
    <br/>
    <button onclick="processVideo()">Remove Background</button>
  </div>

  <video id="videoPreview" controls style="display:none;"></video>
  <canvas id="canvas"></canvas>

  <div class="download-btns" id="downloadSection" style="display:none;">
    <button onclick="downloadVideo()">Download</button>
    <a id="manualDownload" href="#" download>Manual Download</a>
  </div>

  <div id="status"></div>
</div>

<footer style="text-align:center; margin-top: 40px; padding: 15px; background: #dfe6e9;">
  Made by Engineering Softcodes™ | <a href="mailto:engineeringsoftcodes@mail.com">Contact Us</a><br/>
  <a href="#">Privacy Policy</a> • <a href="#">Terms</a> • <a href="#">About</a>
</footer>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const video = document.getElementById("videoPreview");
const bgUpload = document.getElementById("bgUpload");
const sensitivity = document.getElementById("sensitivity");
const sensitivityValue = document.getElementById("sensitivityValue");
const formatSelect = document.getElementById("downloadFormat");
const status = document.getElementById("status");
let stream, recorder, chunks = [];
let backgroundImage = null;

sensitivity.oninput = () => {
  sensitivityValue.innerText = sensitivity.value;
};

function toggleTheme() {
  document.body.classList.toggle("dark-mode");
}

bgUpload.addEventListener("change", () => {
  const file = bgUpload.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => backgroundImage = img;
  img.src = URL.createObjectURL(file);
});

function processVideo() {
  const file = document.getElementById("videoUpload").files[0];
  if (!file) return alert("Please upload a video!");

  video.src = URL.createObjectURL(file);
  video.crossOrigin = "anonymous";
  video.muted = true;
  video.load();

  video.onloadedmetadata = () => {
    video.style.display = "block";
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    stream = canvas.captureStream(30);
    chunks = [];

    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => chunks.push(e.data);
    recorder.onstop = () => {
      const type = formatSelect.value === "mp4" ? "video/webm" : "video/webm"; // MP4 simulated
      const blob = new Blob(chunks, { type });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = `remou_output.${formatSelect.value}`;
      a.click();

      document.getElementById("manualDownload").href = url;
      document.getElementById("manualDownload").style.display = "inline-block";
    };

    status.innerText = "⏳ Removing background...";
    recorder.start();
    video.play();
    drawFrame();
  };
}

function drawFrame() {
  if (video.paused || video.ended) {
    recorder.stop();
    document.getElementById("downloadSection").style.display = "block";
    status.innerText = "✅ Done!";
    return;
  }

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
  let data = frame.data;
  const sens = parseInt(sensitivity.value);

  for (let i = 0; i < data.length; i += 4) {
    let r = data[i], g = data[i + 1], b = data[i + 2];
    if (g > sens && r < sens / 2 && b < sens / 2) {
      if (backgroundImage) {
        let x = (i / 4) % canvas.width;
        let y = Math.floor(i / 4 / canvas.width);
        ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
      }
      data[i + 3] = 0;
    }
  }

  ctx.putImageData(frame, 0, 0);
  requestAnimationFrame(drawFrame);
}

function downloadVideo() {
  // Handled by recorder.onstop
}
</script>
</body>
  </html>
