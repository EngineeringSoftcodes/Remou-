<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remou™</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #2e2a4f, #1f1b33);
      color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #3d3570;
      padding: 1rem;
      text-align: center;
      font-size: 1.8rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    main {
      flex: 1;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    input[type="file"], select, button, input[type="range"] {
      margin: 0.5rem;
      padding: 0.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button {
      background-color: #6a56ff;
      color: white;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #5442e2;
    }

    canvas {
      margin-top: 1rem;
      max-width: 100%;
      background-color: #000;
      border: 2px solid #6a56ff;
      border-radius: 10px;
    }

    progress {
      width: 300px;
      height: 20px;
      margin-top: 1rem;
    }

    .message {
      margin-top: 1rem;
      font-size: 1.1rem;
      color: #ffc6ec;
    }

    footer {
      background-color: #15132b;
      text-align: center;
      font-size: 0.9rem;
      padding: 1rem;
      border-top: 1px solid #3d3570;
    }

    footer a {
      color: #aaa;
      text-decoration: none;
      margin: 0 0.5rem;
    }

    footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <header>Remou™</header>
  <main>
    <input type="file" id="upload" accept="video/*,image/*" />
    <label>FPS:</label>
    <select id="fpsSelect">
      <option value="30">30 FPS</option>
      <option value="60">60 FPS</option>
      <option value="120">120 FPS</option>
    </select>

    <label>Green Removal Strength:</label>
    <input type="range" id="threshold" min="50" max="250" value="120" />

    <label>Quality:</label>
    <select id="qualitySelect">
      <option value="360">360p</option>
      <option value="720">720p</option>
      <option value="1080">1080p</option>
    </select>

    <label>Export Format:</label>
    <select id="formatSelect">
      <option value="webm">WebM</option>
      <option value="mp4">MP4</option>
    </select>

    <button onclick="processMedia()">Remove Green Screen</button>
    <button onclick="download()">Download</button>
    <button onclick="reset()">Reset</button>

    <canvas id="outputCanvas"></canvas>
    <progress id="progressBar" value="0" max="100" style="display: none;"></progress>
    <div class="message">Thanks for using Remou™, good boy/girl.</div>
  </main>

  <footer>
    Made by Engineering Softcodes ™ |
    <a href="#">Terms of Service</a> |
    <a href="#">Privacy Policy</a> |
    <a href="#">Legal</a> |
    <a href="mailto:engineeringsoftcodes@mail.com">Contact</a>
  </footer>

  <script>
    const canvas = document.getElementById('outputCanvas');
    const ctx = canvas.getContext('2d');
    const progressBar = document.getElementById('progressBar');
    let video = null;
    let image = null;

    function processMedia() {
      const fileInput = document.getElementById('upload');
      const file = fileInput.files[0];
      const fps = parseInt(document.getElementById('fpsSelect').value, 10);
      const threshold = parseInt(document.getElementById('threshold').value, 10);
      if (!file) return alert("Upload an image or video first");

      if (file.type.startsWith("image")) {
        image = new Image();
        image.onload = () => {
          canvas.width = image.width;
          canvas.height = image.height;
          ctx.drawImage(image, 0, 0);
          let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < frame.data.length; i += 4) {
            let r = frame.data[i];
            let g = frame.data[i + 1];
            let b = frame.data[i + 2];
            if (g > threshold && r < threshold / 2 && b < threshold / 2) {
              frame.data[i + 3] = 0;
            }
          }
          ctx.putImageData(frame, 0, 0);
        };
        image.src = URL.createObjectURL(file);
        return;
      }

      // Process video
      video = document.createElement('video');
      video.src = URL.createObjectURL(file);
      video.muted = true;
      video.play();

      video.addEventListener('loadeddata', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const interval = 1000 / fps;
        progressBar.style.display = 'block';

        const drawFrame = () => {
          if (video.paused || video.ended) {
            progressBar.style.display = 'none';
            return;
          }

          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
          let frame = ctx.getImageData(0, 0, canvas.width, canvas.height);
          for (let i = 0; i < frame.data.length; i += 4) {
            let r = frame.data[i];
            let g = frame.data[i + 1];
            let b = frame.data[i + 2];
            if (g > threshold && r < threshold / 2 && b < threshold / 2) {
              frame.data[i + 3] = 0;
            }
          }

          ctx.putImageData(frame, 0, 0);
          progressBar.value = (video.currentTime / video.duration) * 100;
          setTimeout(drawFrame, interval);
        };

        drawFrame();
      });
    }

    function download() {
      const format = document.getElementById('formatSelect').value;
      const link = document.createElement('a');
      link.download = `remou_output.${format}`;
      link.href = canvas.toDataURL(`image/${format === "webm" ? "webp" : "png"}`);
      link.click();
    }

    function reset() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      progressBar.style.display = 'none';
      progressBar.value = 0;
    }
  </script>
</body>
  </html>
